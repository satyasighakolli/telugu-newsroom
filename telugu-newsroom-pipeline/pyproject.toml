[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telugu-newsroom-pipeline"
version = "0.1.0"
description = "Evidence-first long-video analysis and social news clipping pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "AXIOMIA / TV5 pipeline prototype" }]
dependencies = [
    "ollama>=0.1.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "qwen-agent>=0.2.0",
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "huggingface-hub>=0.20.0",
    "scenedetect[opencv]>=0.6.7",
    "opencv-python>=4.8.0",
    "av>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "json-repair>=0.25.0",
    "google-generativeai>=0.8.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "yt-dlp>=2024.0.0",
    "static-ffmpeg>=2.5",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
media = ["scenedetect[opencv]>=0.6.7"]

[project.scripts]
newsroom-pipeline = "telugu_newsroom.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
